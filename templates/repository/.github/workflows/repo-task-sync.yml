name: Repo task sync

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-task-sync:
    name: repo-task-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Validate task snapshots and PR association
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            node .ai-team/check.mjs --all
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            node .ai-team/check.mjs --base "$BASE_SHA" --all --aggregate
          else
            node .ai-team/check.mjs --base "$BASE_SHA" --all
          fi
      - name: Publish functional and code progress
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            node .ai-team/github-report.mjs --base "$BASE_SHA" --aggregate >> "$GITHUB_STEP_SUMMARY"
          else
            node .ai-team/github-report.mjs --base "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
